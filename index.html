<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Mercadoria Legal</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Minha Loja Virtual Senai</h1>

    <div class="loja">

        <div class="card">
            <img src="woddy.jpeg" alt="Produto 1">
            <h3>Woffy</h3>
            <p class="preco">R$ 49,90</p>
            <button>Comprar</button>
        </div>

        <div class="card">
            <img src="lady.jpeg" alt="Produto 2">
            <h3>Boneco Lady Fu</h3>
            <p class="preco">R$ 260,00</p>
            <button>Comprar</button>
        </div>

        <div class="card">
            <img src="auni.jpeg" alt="Produto 3">
            <h3>Auniqua Boneca</h3>
            <p class="preco">R$ 26,00</p>
            <button>Comprar</button>
        </div>


        <div class="card">
            <img src="buzz.jpeg" alt="Produto 4">
            <h3>Buzz Lithir</h3>
            <p class="preco">R$ 677,90</p>
            <button>Comprar</button>
        </div>

        <div class="card">
            <img src="mc.jpeg" alt="Produto 5">
            <h3>Mc Maquen</h3>
            <p class="preco">R$ 250,00</p>
            <button>Comprar</button>
        </div>

        <div class="card">
            <img src="urso.jpeg" alt="Produto 6">
            <h3>Ursinho Pimposo</h3>
            <p class="preco">R$ 15,50</p>
            <button>Comprar</button>
        </div>

        <div class="card">
            <img src="l.jpeg" alt="Produto 7">
            <h3>Bonecos Coleção Luccas Neto e Giovana</h3>
            <p class="preco">R$ 120,00</p>
            <button>Comprar</button>
        </div>

        <div class="card">
            <img src="dino.png" alt="Produto 8">
            <h3>Dino T-REX</h3>
            <p class="preco">R$ 75,00</p>
            <button>Comprar</button>
        </div>

    </div>

</body>
</html>
